$kind: http-request
url: "{{baseUrl}}/caravanas"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "rey": "MELCHOR",
      "ofrenda": "ORO",
      "origen": "Persia",
      "camellos": 5
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 409", () => pm.response.to.have.status(409));
      pm.test("codigo REY_DUPLICADO", () => pm.expect(pm.response.json().codigo).to.eql("REY_DUPLICADO"));
    language: text/javascript
order: 11000

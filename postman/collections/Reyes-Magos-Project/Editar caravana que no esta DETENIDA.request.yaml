$kind: http-request
url: "{{baseUrl}}/caravanas/{{caravanaId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "rey": "MELCHOR",
      "ofrenda": "ORO",
      "origen": "Persia",
      "camellos": 5
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 409", () => pm.response.to.have.status(409));
      pm.test("codigo CARAVANA_NO_EDITABLE", () => pm.expect(pm.response.json().codigo).to.eql("CARAVANA_NO_EDITABLE"));
    language: text/javascript
order: 44000

$kind: http-request
url: "{{baseUrl}}/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "jefe@polonorte.test",
      "password": "incorrecta"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 401", () => pm.response.to.have.status(401));
      pm.test("codigo CREDENCIALES_INVALIDAS", () => pm.expect(pm.response.json().codigo).to.eql("CREDENCIALES_INVALIDAS"));
    language: text/javascript
order: 3000

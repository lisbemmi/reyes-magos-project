$kind: http-request
url: "{{baseUrl}}/caravanas?estado=XYZ"
method: GET
queryParams:
  estado: XYZ
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 400", () => pm.response.to.have.status(400));
      pm.test("codigo VALIDACION_FALLIDA", () => pm.expect(pm.response.json().codigo).to.eql("VALIDACION_FALLIDA"));
    language: text/javascript
order: 7000

$kind: http-request
url: "{{baseUrl}}/caravanas"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "rey": "BALTASAR",
      "ofrenda": "MIRRA",
      "origen": "Arabia",
      "camellos": 4
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 401", () => pm.response.to.have.status(401));
      pm.test("codigo NO_AUTENTICADO", () => pm.expect(pm.response.json().codigo).to.eql("NO_AUTENTICADO"));
    language: text/javascript
order: 12000

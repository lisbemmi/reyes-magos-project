$kind: http-request
url: "{{baseUrl}}/caravanas/{{caravanaId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "rey": "MELCHOR",
      "ofrenda": "ORO",
      "origen": "Persia",
      "camellos": 6
    }
scripts:
  - type: afterResponse
    code: pm.test("Status 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 14000

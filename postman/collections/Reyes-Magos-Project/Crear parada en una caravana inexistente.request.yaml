$kind: http-request
url: "{{baseUrl}}/caravanas/999/paradas"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "ciudad": "Alejandría",
      "orden": 1,
      "diasEstancia": 2
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 404", () => pm.response.to.have.status(404));
      pm.test("codigo NO_ENCONTRADO", () => pm.expect(pm.response.json().codigo).to.eql("NO_ENCONTRADO"));
    language: text/javascript
order: 21000

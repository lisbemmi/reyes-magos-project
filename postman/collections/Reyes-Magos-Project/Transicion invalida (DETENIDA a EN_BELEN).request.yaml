$kind: http-request
url: "{{baseUrl}}/caravanas/{{caravanaId}}/estado"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "estado": "EN_BELEN"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 409", () => pm.response.to.have.status(409));
      pm.test("codigo TRANSICION_INVALIDA", () => pm.expect(pm.response.json().codigo).to.eql("TRANSICION_INVALIDA"));
    language: text/javascript
order: 28000

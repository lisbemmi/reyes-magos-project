$kind: http-request
url: "{{baseUrl}}/caravanas/{{caravanaId}}/paradas"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "ciudad": "Alejandría",
      "orden": 4,
      "diasEstancia": 9
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 400", () => pm.response.to.have.status(400));
      pm.test("codigo VALIDACION_FALLIDA", () => pm.expect(pm.response.json().codigo).to.eql("VALIDACION_FALLIDA"));
    language: text/javascript
order: 20000

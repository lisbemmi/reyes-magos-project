$kind: http-request
url: "{{baseUrl}}/caravanas"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "rey": "GASPAR",
      "ofrenda": "INCIENSO",
      "origen": "Arabia",
      "camellos": 20
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 400", () => pm.response.to.have.status(400));
      pm.test("codigo VALIDACION_FALLIDA", () => pm.expect(pm.response.json().codigo).to.eql("VALIDACION_FALLIDA"));
    language: text/javascript
order: 10000

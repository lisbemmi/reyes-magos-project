$kind: http-request
url: "{{baseUrl}}/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "pastor@belen.test",
      "password": "{{password}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.collectionVariables.set("tokenPastor", pm.response.json().token);
    language: text/javascript
order: 2000

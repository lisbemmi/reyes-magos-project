$kind: http-request
url: "{{baseUrl}}/caravanas/{{caravanaId}}/paradas"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "ciudad": "Alejandría",
      "orden": 1,
      "diasEstancia": 2
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 409", () => pm.response.to.have.status(409));
      pm.test("codigo ORDEN_DUPLICADO", () => pm.expect(pm.response.json().codigo).to.eql("ORDEN_DUPLICADO"));
    language: text/javascript
order: 19000

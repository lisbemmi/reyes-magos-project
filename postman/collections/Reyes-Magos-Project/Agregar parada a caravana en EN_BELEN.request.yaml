$kind: http-request
url: "{{baseUrl}}/caravanas/{{caravanaId}}/paradas"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "ciudad": "Belén",
      "orden": 4,
      "diasEstancia": 1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 409", () => pm.response.to.have.status(409));
      pm.test("codigo CARAVANA_CERRADA", () => pm.expect(pm.response.json().codigo).to.eql("CARAVANA_CERRADA"));
    language: text/javascript
order: 43000

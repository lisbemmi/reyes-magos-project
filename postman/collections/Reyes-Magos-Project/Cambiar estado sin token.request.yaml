$kind: http-request
url: "{{baseUrl}}/caravanas/{{caravanaId}}/estado"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "estado": "EN_CAMINO"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 401", () => pm.response.to.have.status(401));
      pm.test("codigo NO_AUTENTICADO", () => pm.expect(pm.response.json().codigo).to.eql("NO_AUTENTICADO"));
    language: text/javascript
order: 30000

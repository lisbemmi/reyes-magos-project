$kind: http-request
url: "{{baseUrl}}/caravanas"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "rey": "BALTASAR",
      "ofrenda": "MIRRA",
      "origen": "Arabia",
      "camellos": 4
    }
auth:
  type: bearer
  credentials:
    token: "{{tokenPastor}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status 403", () => pm.response.to.have.status(403));
      pm.test("codigo PROHIBIDO", () => pm.expect(pm.response.json().codigo).to.eql("PROHIBIDO"));
    language: text/javascript
order: 13000
